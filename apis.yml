aid: klarity
name: Klarity
description: >-
  Klarity is an enterprise AI company behind Klarity Architect, the "Enterprise
  Instinct Platform" — a Context Graph that captures how work actually happens
  inside a large organization and turns it into a living operational digital
  twin. The platform runs in three phases: Discover (an AI Companion that
  observes work, an AI Interviewer, and bulk file upload capture documented and
  undocumented processes), Structure (AI mapping organizes what it finds into a
  multi-level, role-aware Process Index from value streams down to individual
  activities), and Improve (an Advisor agent surfaces ROI-ranked recommendations
  and Signals detect drift from an approved standard). Klarity is used for
  finance, IT, GTM, HR and operations transformation, audit and compliance
  documentation, automation assessment, and SOP/PDD generation, with customers
  including DoorDash, Stripe, Salesforce and Uber. The product is delivered as a
  SaaS workspace with SAML SSO and fine-grained access control; Klarity
  publishes user documentation and an llms.txt index but no public developer
  API, SDKs, or webhook surface at the time of this profile.
